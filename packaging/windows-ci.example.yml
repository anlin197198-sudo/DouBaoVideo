# Template only. Enable in .github/workflows on an authorized validation branch.
name: Windows installer build validation

"on":
  workflow_dispatch:
  push:
    branches:
      - ci/windows-installer-validation

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out this exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm.cmd ci

      - name: Run project tests
        run: npm.cmd test

      - name: Build unsigned installer without publishing
        run: npm.cmd run package:win

      - name: Check the installer and record its hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "dist/windows/DouBaoVideo-$($version)-x64-Setup.exe"
          $item = Get-Item -LiteralPath $installer
          if ($item.Length -lt 1000000) { throw 'Missing or incomplete installer.' }
          $stream = [System.IO.File]::OpenRead($item.FullName)
          try {
            if ($stream.ReadByte() -ne 0x4d -or $stream.ReadByte() -ne 0x5a) {
              throw 'Installer does not have a Windows executable header.'
            }
          } finally {
            $stream.Dispose()
          }
          $hash = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($item.Name)" | Set-Content -LiteralPath 'dist/windows/installer.sha256' -Encoding ascii
          Write-Host "Unsigned build only: $($item.Name), SHA-256 $hash. Installation and upgrade are not tested by this job."

      - name: Save validation artifacts only in private repositories
        if: ${{ github.event.repository.private == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DouBaoVideo-windows-x64-validation
          path: |
            dist/windows/DouBaoVideo-*-x64-Setup.exe
            dist/windows/installer.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
